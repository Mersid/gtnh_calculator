server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Not a client-routed SPA, but the fallback is harmless and covers stray paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The app fetches data/data.bin (~29 MB) — no gzip for it (binary, already packed),
    # but compress text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static files never change inside an image — let browsers cache them for the
    # image's lifetime (bust cache by rebuilding the image)
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location /data/ {
        # data.bin is fetched once per page load; atlas.webp likewise
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
